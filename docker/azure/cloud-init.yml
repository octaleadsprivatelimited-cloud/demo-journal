#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - ca-certificates
runcmd:
  - systemctl enable --now docker
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - sh -c 'echo "/swapfile none swap sw 0 0" >> /etc/fstab'
  - mkdir -p /opt/journal
  - chown journaladmin:journaladmin /opt/journal
  - usermod -aG docker journaladmin
