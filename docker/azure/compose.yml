name: journal-production
services:
  app:
    image: journal-azure:production
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./uploads:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: journal
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U journal -d journal']
      interval: 5s
      retries: 12
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=30']
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80','443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data
    depends_on: [app]
